# A PipeWire filter graph that publishes a denoised copy of your microphone as
# a second, selectable source called "Voice Focus".
#
# Run as its own small PipeWire instance rather than dropped into
# ~/.config/pipewire/pipewire.conf.d/, because a drop-in is always loaded: the
# filter would exist from login whether or not anyone wanted it. A separate
# instance can be started and stopped like the camera daemon, which is what the
# bar widget does.
#
# The suppression is RNNoise, on the CPU on purpose. The NPU earns its place in
# the video path because segmentation costs 12.4% of a core there and 1.6% on
# the NPU; RNNoise is an 85k-parameter GRU costing about 1%, so there is nothing
# to move and a heavier model would be the only reason to.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = {
            nice.level = -11
            rt.prio    = 88
        }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Voice Focus"
            media.name       = "Voice Focus"

            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = /usr/lib/ladspa/librnnoise_ladspa.so
                        label  = noise_suppressor_mono
                        control = {
                            # Below this confidence a frame is treated as noise
                            # and silenced. Low enough not to clip the start of
                            # a quiet word; a high threshold is what makes these
                            # filters swallow the first syllable of a sentence.
                            "VAD Threshold (%)"          = 50.0
                            # Keep passing audio briefly after speech stops, so
                            # the tail of a word is not cut off.
                            "VAD Grace Period (ms)"      = 200
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                ]
            }

            # The graph is left to work out its own ports, and the source is
            # mono. That is not an oversight, and it is not worth "fixing".
            #
            # A mono microphone monitored through stereo speakers can come out
            # of the left one only, and the obvious answers -- a second output
            # through a `copy` node, or declaring stereo on playback.props --
            # both stop the graph dead. Measured, against a tone the microphone
            # could hear at 10%: mono graph passes it, either stereo variant
            # produces exact silence with the graph reporting an error. A
            # microphone that plays out of one speaker while being monitored is
            # a far smaller problem than one that produces nothing at all, and
            # what reaches the far end of a call is mono either way.
            capture.props = {
                node.name    = "capture.voice_focus"
                node.passive = true
                audio.rate   = 48000
            }

            playback.props = {
                node.name   = "voice_focus"
                media.class = Audio/Source
                audio.rate  = 48000
            }
        }
    }
]
